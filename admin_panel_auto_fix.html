<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#FBF7EF; --paper:#FFFFFF; --ink:#16302B; --ink-soft:#4B615B;
    --line:#E4DCC8; --line-soft:#EFE9D8; --accent:#E0932E; --accent-deep:#B5691A;
    --accent-bg:#FBEBD3; --good:#2F7A4D; --good-bg:#E5F2E9; --bad:#B23B3B; --bad-bg:#FBE7E7;
    --sidebar:#122A25; --sidebar-soft:#9FC4B9;
    --mono:'JetBrains Mono',monospace; --display:'Fraunces',serif; --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:var(--body);}
  body{background:var(--bg);color:var(--ink);}

  .authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sidebar);padding:20px;}
  .authcard{background:var(--paper);border-radius:16px;padding:32px 30px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .authcard h2{font-family:var(--display);margin:0 0 4px 0;font-size:22px;}
  .authcard p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 18px 0;}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:10px;}
  input,select{font-family:var(--body);font-size:13.5px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);width:100%;}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .autherr{color:var(--bad);font-size:12.5px;margin:4px 0;min-height:16px;padding:6px;background:var(--bad-bg);border-radius:4px;}
  .authok{color:var(--good);font-size:12.5px;margin:4px 0;padding:6px;background:var(--good-bg);border-radius:4px;}
  button.btn{font-family:var(--body);font-weight:600;font-size:13px;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--ink);color:#fff;width:100%;margin-top:8px;}
  button.btn:hover{background:#0d201c;}
  button.btn.accent{background:var(--accent);color:#1c1206;}
  button.btn.accent:hover{background:var(--accent-deep);}
  button.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto;}
  button.btn:disabled{opacity:.5;cursor:not-allowed;}

  .app{display:none;min-height:100vh;flex-direction:column;}
  .app.active{display:flex;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--paper);}
  .topbar h1{font-family:var(--display);font-size:21px;margin:0;font-weight:600;}
  .content{flex:1;padding:22px 28px;max-width:1280px;margin:0 auto;width:100%;}

  .cardrow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:150px;flex:1;}
  .stat .label{font-size:10px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .stat .value{font-family:var(--display);font-size:24px;font-weight:600;margin-top:5px;}

  .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px;}
  table.datatable{width:100%;border-collapse:collapse;font-size:13px;}
  table.datatable th{text-align:left;font-size:10px;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:8px;font-weight:600;}
  table.datatable td{padding:9px 8px;border-bottom:1px solid var(--line-soft);}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill.good{background:var(--good-bg);color:var(--good);}
  .pill.bad{background:var(--bad-bg);color:var(--bad);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .toolbar input{max-width:280px;flex:1;min-width:150px;}
  .toolbar button{margin:0;width:auto;}

  .empty-hint{color:var(--ink-soft);font-size:13px;text-align:center;padding:26px 10px;}
</style>
</head>
<body>

<div class="authwrap" id="authWrap">
  <div class="authcard">
    <h2 id="authTitle">Admin Setup</h2>
    <p class="sub" id="authSub">Pehli baar — apna Admin username/password banayein.</p>
    <div id="authBody"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <h1>Vendor Admin Panel</h1>
    <button class="btn ghost" onclick="logout()">Logout</button>
  </div>
  <div class="content">
    <div class="cardrow" id="statsRow"></div>
    <div class="panel">
      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search...">
        <button class="btn accent" onclick="alert('Coming soon')">+ Add Client</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="datatable">
          <thead><tr>
            <th>Status</th><th>Client ID</th><th>Name</th><th>Plan</th><th>Last Seen</th>
          </tr></thead>
          <tbody id="clientsTbody">
            <tr><td colspan="5" class="empty-hint">Loading restaurants...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
console.log('Script starting...');

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBXHpIgiJ3cMkrWRdWG6DmIVWX3vZNkRJQ",
  authDomain: "bokaro-desk.firebaseapp.com",
  projectId: "bokaro-desk",
  storageBucket: "bokaro-desk.firebasestorage.app",
  messagingSenderId: "885046809605",
  appId: "1:885046809605:web:5781bf0dfc29d0d7d0386c"
};

const COL = 'hotel_data';
let db = null;

// Initialize Firebase
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  console.log('Firebase initialized successfully');
} catch(e) {
  console.error('Firebase init error:', e);
  alert('Firebase initialization failed: ' + e.message);
}

// Crypto helpers
function bytesToHex(bytes){ 
  return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join(''); 
}

function hexToBytes(hex){ 
  const arr=new Uint8Array(hex.length/2); 
  for(let i=0;i<arr.length;i++) arr[i]=parseInt(hex.substr(i*2,2),16); 
  return arr; 
}

async function hashPassword(password, saltHex){
  const enc = new TextEncoder();
  const saltBytes = saltHex ? hexToBytes(saltHex) : crypto.getRandomValues(new Uint8Array(16));
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt: saltBytes, iterations: 100000}, keyMaterial, 256);
  return { hash: bytesToHex(new Uint8Array(bits)), salt: bytesToHex(saltBytes) };
}

function randomKey(len){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const arr = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(arr).map(b=>chars[b % chars.length]).join('');
}

// Get admin document
async function getAdminDoc(){
  try {
    const doc = await db.collection(COL).doc('superadmin').get();
    return doc.exists ? doc.data() : null;
  } catch(e) {
    console.error('Error getting admin doc:', e);
    return null;
  }
}

// Check if setup is complete
async function isAdminSetupComplete(){
  const admin = await getAdminDoc();
  if(!admin) return false;
  return !!(admin.passwordHash || admin.password || admin.username);
}

// Render auth screen
async function renderAuth(){
  console.log('Rendering auth...');
  const setupComplete = await isAdminSetupComplete();
  console.log('Setup complete:', setupComplete);
  
  if(!setupComplete){
    document.getElementById('authTitle').textContent = '🔐 Admin Setup';
    document.getElementById('authSub').textContent = 'Apna Admin username aur password banayein';
    document.getElementById('authBody').innerHTML = `
      <label class="f">Admin Username<input id="su_user" placeholder="Jaise: sumit" type="text"></label>
      <label class="f">Admin Password<input id="su_pass" placeholder="Koi strong password" type="password"></label>
      <div class="autherr" id="authErr"></div>
      <button class="btn accent" onclick="submitAdminSetup()">Admin Account Banayein</button>
    `;
  } else {
    document.getElementById('authTitle').textContent = '🔓 Admin Login';
    document.getElementById('authSub').textContent = 'Apna username aur password daalein';
    document.getElementById('authBody').innerHTML = `
      <label class="f">Username<input id="li_user" type="text"></label>
      <label class="f">Password<input id="li_pass" type="password"></label>
      <div class="autherr" id="authErr"></div>
      <button class="btn accent" onclick="submitAdminLogin()">Login</button>
      <br>
      <button class="btn ghost" style="width:100%;margin-top:12px;" onclick="resetAdmin()">Naya Account Banayein</button>
    `;
  }
}

async function resetAdmin(){
  if(!confirm('Kya aap sure hain? Purana account delete ho jayega.')) return;
  try {
    await db.collection(COL).doc('superadmin').delete();
    await renderAuth();
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

async function submitAdminSetup(){
  const uname = document.getElementById('su_user').value.trim();
  const upass = document.getElementById('su_pass').value;
  const err = document.getElementById('authErr');
  
  if(!uname || !upass){ 
    err.textContent = '❌ Dono fields bharein'; 
    return; 
  }
  
  if(upass.length < 4){
    err.textContent = '❌ Password kam se kam 4 characters ho';
    return;
  }
  
  try {
    const {hash, salt} = await hashPassword(upass);
    await db.collection(COL).doc('superadmin').set({
      username: uname, 
      passwordHash: hash, 
      salt: salt, 
      createdAt: new Date().toISOString()
    });
    err.textContent = '';
    err.innerHTML = '<div class="authok">✅ Account ban gaya! Login karein...</div>';
    setTimeout(() => {
      try { localStorage.setItem('admin_session_user', uname); }catch(e){}
      enterApp(uname);
    }, 1000);
  } catch(e) {
    err.textContent = '❌ Error: ' + e.message;
  }
}

async function submitAdminLogin(){
  const uname = document.getElementById('li_user').value.trim();
  const upass = document.getElementById('li_pass').value;
  const err = document.getElementById('authErr');
  
  if(!uname || !upass){ 
    err.textContent = '❌ Dono fields bharein'; 
    return; 
  }
  
  try {
    const existing = await getAdminDoc();
    if(!existing || existing.username !== uname){ 
      err.textContent = '❌ Username ya password galat hai'; 
      return; 
    }
    
    let ok = false;
    if(existing.passwordHash && existing.salt){
      const {hash} = await hashPassword(upass, existing.salt);
      ok = (hash === existing.passwordHash);
    } else if(existing.password){
      ok = (upass === existing.password);
    }
    
    if(!ok){ 
      err.textContent = '❌ Username ya password galat hai'; 
      return; 
    }
    
    err.textContent = '';
    err.innerHTML = '<div class="authok">✅ Login successful!</div>';
    setTimeout(() => {
      try { localStorage.setItem('admin_session_user', uname); }catch(e){}
      enterApp(uname);
    }, 500);
  } catch(e) {
    err.textContent = '❌ Error: ' + e.message;
  }
}

function logout(){
  try { localStorage.removeItem('admin_session_user'); }catch(e){}
  document.getElementById('app').classList.remove('active');
  document.getElementById('authWrap').style.display = 'flex';
  renderAuth();
}

function enterApp(uname){
  document.getElementById('authWrap').style.display = 'none';
  document.getElementById('app').classList.add('active');
  loadRestaurants();
}

async function loadRestaurants(){
  try {
    const snap = await db.collection(COL).doc('__client_index__').get();
    const list = snap.exists ? (snap.data().clients || []) : [];
    
    if(list.length === 0){
      document.getElementById('clientsTbody').innerHTML = '<tr><td colspan="5" class="empty-hint">Koi restaurant nahi mila</td></tr>';
      return;
    }
    
    const tbody = document.getElementById('clientsTbody');
    tbody.innerHTML = list.map(c => `
      <tr>
        <td><span class="pill good">Online</span></td>
        <td style="font-family:monospace;font-size:11px;">${c.id}</td>
        <td>${c.id}</td>
        <td>Trial</td>
        <td>Just now</td>
      </tr>
    `).join('');
  } catch(e) {
    console.error('Error loading restaurants:', e);
    document.getElementById('clientsTbody').innerHTML = '<tr><td colspan="5" class="empty-hint">Error loading data</td></tr>';
  }
}

// Initialize
(async function init(){
  console.log('Init starting...');
  await renderAuth();
  
  let sessionUser = null;
  try { sessionUser = localStorage.getItem('admin_session_user'); }catch(e){}
  
  if(sessionUser){
    const setupComplete = await isAdminSetupComplete();
    if(setupComplete){
      enterApp(sessionUser);
    }
  }
})();
</script>
</body>
</html>
